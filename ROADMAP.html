<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVE // Roadmap</title>
    <style>
        :root {
            --bg-void: #060709;
            --bg-panel: #0E1118;
            --bg-panel-header: #141824;
            --bg-input: #1B2030;
            --border-color: #232B3E;
            --border-highlight: #00F0FF40;
            --accent-gold: #FFB800;
            --accent-cyan: #00F0FF;
            --text-primary: #E0E6ED;
            --text-muted: #6C7A9C;
            --danger: #FF5C7A;
            --ok: #3DDC97;
            --font-mono: "SF Mono", "Cascadia Mono", "JetBrains Mono", ui-monospace, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: var(--bg-void);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 13px;
            height: 100vh;
            display: grid;
            grid-template-rows: 46px 1fr 26px;
            overflow: hidden;
        }
        header {
            background: var(--bg-panel-header);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 0 16px;
        }
        .brand {
            font-family: var(--font-mono);
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            white-space: nowrap;
        }
        .brand-icon {
            width: 10px; height: 10px;
            background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
            transform: rotate(45deg);
        }
        .progress-wrap { flex: 1; min-width: 120px; }
        .progress-meta {
            display: flex; justify-content: space-between;
            font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);
            margin-bottom: 4px;
        }
        .progress-bar { height: 4px; background: var(--bg-input); border-radius: 2px; overflow: hidden; }
        .progress-bar > span { display: block; height: 100%; background: var(--accent-cyan); width: 0%; }
        .current-inc {
            font-family: var(--font-mono); font-size: 11px; color: var(--accent-cyan);
            max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .hdr-actions { display: flex; gap: 6px; }
        button, .btn {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.6px;
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 2px;
        }
        button:hover, .btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        button.gold {
            background: rgba(255,184,0,0.12);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }
        button.gold:hover { background: var(--accent-gold); color: var(--bg-void); }
        button.danger { color: var(--danger); border-color: #5a2230; background: transparent; }
        .layout {
            display: grid;
            grid-template-columns: 200px 1fr 320px;
            min-height: 0;
        }
        .phases {
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            padding: 12px 8px;
            overflow-y: auto;
        }
        .phase-label {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
            padding: 4px 8px 8px;
        }
        .phase-btn {
            width: 100%;
            text-align: left;
            background: transparent;
            border: 1px solid transparent;
            padding: 8px 10px;
            margin-bottom: 4px;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 12px;
        }
        .phase-btn small { display: block; color: var(--text-muted); font-size: 10px; margin-top: 2px; font-family: var(--font-mono); }
        .phase-btn:hover { background: var(--bg-input); }
        .phase-btn.active {
            border-color: var(--accent-gold);
            background: rgba(255,184,0,0.08);
            color: var(--accent-gold);
        }
        .board {
            overflow-y: auto;
            padding: 16px 18px 32px;
            background: #080A0F;
        }
        .board-head {
            display: flex; justify-content: space-between; align-items: baseline;
            margin-bottom: 14px;
        }
        .board-head h2 {
            font-family: var(--font-mono);
            font-size: 13px;
            letter-spacing: 1px;
            color: var(--accent-gold);
            text-transform: uppercase;
        }
        .board-head span { color: var(--text-muted); font-size: 11px; font-family: var(--font-mono); }
        .card-list { display: flex; flex-direction: column; gap: 10px; }
        .card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 12px;
        }
        .card.next, .card.building { border-color: var(--accent-gold); box-shadow: 0 0 0 1px rgba(255,184,0,0.2); }
        .card.testing { border-color: var(--accent-cyan); }
        .card.shipped { opacity: 0.72; }
        .card-top { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
        .pill {
            font-family: var(--font-mono);
            font-size: 9px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding: 3px 6px;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            white-space: nowrap;
        }
        .pill.next, .pill.building { color: var(--accent-gold); border-color: var(--accent-gold); }
        .pill.testing { color: var(--accent-cyan); border-color: var(--accent-cyan); }
        .pill.shipped { color: var(--ok); border-color: #1e5c40; }
        .pill.parked { color: var(--danger); border-color: #5a2230; }
        .pill.queued { color: var(--text-primary); }
        .card-title {
            flex: 1;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-primary);
            padding: 0 4px;
        }
        .card-title:focus, .grow:focus { outline: none; border-color: var(--accent-cyan); background: var(--bg-input); }
        .field { margin-top: 8px; }
        .field label {
            display: block;
            font-family: var(--font-mono);
            font-size: 9px;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 3px;
        }
        .grow {
            width: 100%;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 12px;
            padding: 4px 6px;
            resize: vertical;
            min-height: 36px;
        }
        .grow.test { min-height: 52px; font-family: var(--font-mono); font-size: 11px; color: var(--accent-cyan); }
        .card-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
        .card-actions button { padding: 4px 8px; }
        .inbox {
            background: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .inbox-head {
            padding: 12px 12px 8px;
            border-bottom: 1px solid var(--border-color);
        }
        .inbox-head h2 {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .queue-form { display: flex; flex-direction: column; gap: 6px; }
        .queue-form input, .queue-form select, .queue-form textarea {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 7px 8px;
            font-size: 12px;
            font-family: var(--font-sans);
            width: 100%;
            border-radius: 2px;
        }
        .queue-form textarea { min-height: 44px; resize: vertical; font-family: var(--font-mono); font-size: 11px; }
        .queue-form input:focus, .queue-form select:focus, .queue-form textarea:focus {
            outline: none; border-color: var(--accent-cyan);
        }
        .row2 { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
        .inbox-list { overflow-y: auto; padding: 8px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .inbox-item {
            background: var(--bg-input);
            border: 1px solid transparent;
            padding: 8px;
        }
        .inbox-item:hover { border-color: var(--border-color); }
        .inbox-item .t { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
        .inbox-item .meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
        .inbox-item .row { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
        .empty {
            color: var(--text-muted);
            font-size: 12px;
            padding: 16px 8px;
            font-family: var(--font-mono);
        }
        footer {
            background: var(--bg-panel-header);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
        }
        .toast {
            position: fixed; top: 56px; left: 50%;
            transform: translateX(-50%) translateY(-8px);
            background: #14532d; color: #fff; padding: 8px 14px;
            font-size: 12px; opacity: 0; pointer-events: none;
            transition: all 0.2s; z-index: 20;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.err { background: #9e2a2b; }
        input[type="file"] { display: none; }
        .proto {
            color: var(--text-muted);
            max-width: 70%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand"><div class="brand-icon"></div>EVE // ROADMAP</div>
        <div class="progress-wrap">
            <div class="progress-meta">
                <span id="progressLabel">0 / 0 shipped</span>
                <span id="filterHint">ALL PHASES</span>
            </div>
            <div class="progress-bar"><span id="progressFill"></span></div>
        </div>
        <div class="current-inc" id="currentInc">NEXT: —</div>
        <div class="hdr-actions">
            <button class="gold" id="btnExport">EXPORT JSON</button>
            <button id="btnImport">IMPORT</button>
            <button class="danger" id="btnReset">RESET SEED</button>
            <input type="file" id="fileImport" accept="application/json,.json">
        </div>
    </header>

    <div class="layout">
        <aside class="phases" id="phaseNav"></aside>
        <main class="board">
            <div class="board-head">
                <h2 id="boardTitle">All phases</h2>
                <span id="boardCount">0 cards</span>
            </div>
            <div class="card-list" id="cardList"></div>
        </main>
        <aside class="inbox">
            <div class="inbox-head">
                <h2>Feature queue</h2>
                <form class="queue-form" id="queueForm">
                    <input id="qTitle" placeholder="Feature to add…" autocomplete="off">
                    <div class="row2">
                        <select id="qPhase">
                            <option value="">Phase later</option>
                            <option value="P1">P1 Pen</option>
                            <option value="P2">P2 Transform</option>
                            <option value="P3">P3 Appearance</option>
                            <option value="P4">P4 Structure</option>
                            <option value="P5">P5 Precision</option>
                            <option value="P6">P6 Later</option>
                        </select>
                        <button class="gold" type="submit">QUEUE</button>
                    </div>
                    <textarea id="qTest" placeholder="Optional acceptance test (what we will assert)"></textarea>
                </form>
            </div>
            <div class="inbox-list" id="inboxList"></div>
        </aside>
    </div>

    <footer>
        <div class="proto">TEST GATE: forced-state number → hardware gesture → regression (deselect hides, zoom, SVG export). Empty test cannot ship.</div>
        <div>ONE increment at a time</div>
        <div>eve-roadmap-v1</div>
    </footer>
    <div class="toast" id="toast"></div>

    <script>
        const STORAGE_KEY = 'eve-roadmap-v1';
        const PHASES = [
            { id: 'all', name: 'All phases', blurb: 'Full board' },
            { id: 'P0', name: 'P0 Shipped', blurb: 'Already in the pen tool' },
            { id: 'P1', name: 'P1 Pen fidelity', blurb: 'Recommended next' },
            { id: 'P2', name: 'P2 Transform', blurb: 'Select, scale, align' },
            { id: 'P3', name: 'P3 Appearance', blurb: 'Stroke, fill, color' },
            { id: 'P4', name: 'P4 Structure', blurb: 'Layers, groups, z-order' },
            { id: 'P5', name: 'P5 Precision', blurb: 'Rulers, snap, numeric' },
            { id: 'P6', name: 'P6 Later', blurb: 'Advanced / export extras' }
        ];
        const STATUSES = ['inbox','queued','next','building','testing','shipped','parked'];
        const NOW = () => new Date().toISOString();
        const uid = () => 'c' + Math.random().toString(36).slice(2, 9);

        function card(partial) {
            return Object.assign({
                id: uid(),
                title: '',
                phase: 'P1',
                status: 'queued',
                why: '',
                test: '',
                notes: '',
                created: NOW(),
                updated: NOW()
            }, partial);
        }

        const SEED_CARDS = [
            card({"id": "c5aikqvn", "title": "brushes and swatches", "phase": "P1", "status": "testing", "why": "Queued from inbox.", "test": "Apply swatches to front fill/stroke target; apply/save/remove brush presets; verify Undo, reload and library JSON export/import. Check new Pencil strokes and multi-selection appearance preservation.", "notes": "swatches will also unit a colour picker app. Implemented 2026-10-21: Brushes and swatches panel, solid colour library, uniform-width stroke presets (width/cap/join/dash), custom names, removal, browser persistence and validated additive JSON import/export. Applies only relevant properties to unlocked visible selection, preserving other styles; one-step Undo. Brush width also sets Pencil base width. Automated library, swapper, gradient, Pencil, Apple Pencil and panel regressions passed. User review pending. Colour-picker app can consume the documented JSON format; direct app integration and variable-width/art brushes are not implemented. See planning/brushes-swatches.md.", "created": "2026-10-15T21:43:00.135Z", "updated": "2026-10-21T21:34:53.196713+00:00"}),
            card({"id": "ceip7mb9", "title": "blend tool", "phase": "P1", "status": "shipped", "why": "Queued from inbox.", "test": "Select two compatible paths with V and Shift-click, create intermediate steps, verify shape/colour transitions, edit generated anchors, Undo/Redo, reload and SVG export. Incompatible endpoints must leave the document unchanged.", "notes": "tool that assists in duplicating and controlling splines/shapes. can be combined with colour to make gradient effects. Implemented 2026-10-21: Blend inspector panel with 1–100 steps and optional colour interpolation; editable anchor/Bezier/width interpolation, solid and compatible linear-gradient paints, source preservation and one-step Undo. Requires matching anchor/contour topology; no live linkage, automatic resampling or blend spine. Tests: tests/blend.py plus library, gradient and panel regressions. Marked shipped in the saved roadmap on 2026-10-21. See planning/blend.md.", "created": "2026-10-15T22:00:05.082Z", "updated": "2026-10-21T22:56:22.092059+00:00"}),
            card({"id": "cp52taxv", "title": "reflect tool", "phase": "P2", "status": "testing", "why": "Queued from inbox.", "test": "Flip selected paths horizontally and vertically; verify custom mirror coordinates, reflected copies, handles, gradients, groups, Undo/Redo, reload and SVG export. Invalid or locked/hidden selections must remain unchanged.", "notes": "Implemented 2026-10-21. Reflect inspector panel with selection-centre or custom X/Y mirror line and optional reflected copies. Mirrors anchors, Bézier handles and gradient directions; copies retain independent groups. Reflected text becomes editable outlines; Undo restores its recipe. Automated tests/reflect.py and precision, blend and text-panel regressions recorded in planning/reflect.md. User/device review pending. Arbitrary-angle axes and interactive axis dragging are outside this version.", "created": "2026-10-21T10:22:58.510Z", "updated": "2026-10-21T22:56:22.092059+00:00"}),
            card({"id": "cjkgoo1s", "title": "stroke width tool", "phase": "P3", "status": "testing", "why": "Queued from inbox.", "test": "Select paths and apply spindle/taper/wave presets; edit width-stop percentages and positions. Check visible thickness, base-weight scaling, gradients, Undo/Redo, reload and JSON/SVG/PNG exports. Uniform restores ordinary strokes.", "notes": "include stroke width profile presets Implemented 2026-10-21: Stroke width inspector panel, presets and 2–32 editable numeric stops (0–400% width). Editable centrelines retained; shared sampled canvas/SVG outline renderer, JSON persistence, visible-outline hit testing and expanded export bounds. Continuous strokes with round joins; dashes restore uniform width. No draggable canvas width handles. Automated tests/stroke_width.py plus seven related regressions passed. Awaiting user review. See planning/stroke-width.md.", "created": "2026-10-21T10:24:13.687Z", "updated": "2026-10-21T22:38:56.515480+00:00"}),
            card({"id": "c0tkdhbq", "title": "clipping mask tool", "phase": "P5", "status": "testing", "why": "Queued from inbox.", "test": "Select artwork and a topmost closed shape; Make mask must hide exterior pixels without destroying paths. Edit mask anchors, move the group, Release, Undo/Redo, duplicate/copy, reload, and export SVG/PNG. Verify holes and rejection of invalid or nested masks.", "notes": "Implemented 2026-10-22. Clipping mask inspector with Make, Release and Edit mask anchors. Topmost closed path clips selected editable artwork; canvas hits respect clipping. Independent copies, JSON/session persistence (including hidden masks), SVG clipPath export/import and PNG export. Automated pixel, geometry, history and guard checks in tests/clipping_mask.py. Ungroup before making masks; no nested or opacity masks. See planning/clipping-mask.md. Awaiting user/device review.", "created": "2026-10-21T22:24:48.765Z", "updated": "2026-10-22T06:50:14.343439+00:00"}),
            card({"id": "p3-colour-swapper", "title": "Colour swapper + picker", "phase": "P3", "status": "shipped", "why": "Record completed appearance work from the October release.", "test": "Switch front fill/stroke target, swap paints, apply black/white, last-used colour, gradient and none; verify selected artwork and Undo.", "notes": "Released 2026.10.16.1. Left-toolbar fill/stroke focus swatches, colour picker, black/white, last-used colour, gradient toggle and none-on-front. Tests: tests/colour_swapper.py. Release evidence: planning/portal-deployment.md.", "created": "2026-10-16T00:00:00.000Z", "updated": "2026-10-21T22:56:22.092059+00:00"}),
            card({"id": "p3-stroke-grad", "title": "Stroke gradients + multi-stop editor", "phase": "P3", "status": "shipped", "why": "Record completed appearance work from the October release.", "test": "Apply a stroke gradient through the swapper, add a stop (2 → 3), export SVG with stroke gradient and Undo.", "notes": "Released 2026.10.16.1. Stroke gradients and multi-stop gradient editing. Live hosted-editor stop count, SVG sgrad export, Undo and no-page-error checks passed; release smoke passed. Tests: tests/stroke_gradient.py. Release evidence: planning/portal-deployment.md.", "created": "2026-10-16T00:00:00.000Z", "updated": "2026-10-21T22:56:22.092059+00:00"}),

            card({ id: 'p0-pen', phase: 'P0', status: 'shipped', title: 'Pen + close + finish',
                why: 'Core plotting path.',
                test: 'Three hardware clicks add 3 nodes; click first point sets closed[0]=true; Esc finishes.' }),
            card({ id: 'p0-va', phase: 'P0', status: 'shipped', title: 'V path select / A direct select',
                why: 'Illustrator selection split.',
                test: 'selectPath → showingNodes false; selectPoint → showingNodes true and selected set.' }),
            card({ id: 'p0-deselect', phase: 'P0', status: 'shipped', title: 'Deselect hides anchors',
                why: 'Anchors are edit chrome, not the drawing.',
                test: 'Click empty world point: showingNodes false. Ctrl+H toggles hideNodes.' }),
            card({ id: 'p0-anchors', phase: 'P0', status: 'shipped', title: 'Small constant-size anchors',
                why: 'Old 10px dots hid the path.',
                test: 'getState().anchorSize ≤ 3 (half-size px) at 100% and at 200% zoom.' }),
            card({ id: 'p0-camera', phase: 'P0', status: 'shipped', title: 'Zoom + pan camera',
                why: 'Artboard is not 1:1 with the window.',
                test: 'zoomAt(x,y,2) doubles camera.scale; Ctrl+wheel increases scale; fitArtboard scale > 0.05.' }),
            card({ id: 'p0-shapes', phase: 'P0', status: 'shipped', title: 'Ellipse (L) + rectangle (M)',
                why: 'Primitives as closed paths.',
                test: 'Drag ellipse/rect; pathCount +1; path.closed true; 4 anchors on each.' }),
            card({ id: 'p0-style-layers', phase: 'P0', status: 'shipped', title: 'Per-path stroke/fill + layers',
                why: 'Appearance is object-level.',
                test: 'Change stroke on selected path; serializeOutline paths[i].stroke matches; layer eye toggles visible.' }),
            card({ id: 'p0-io', phase: 'P0', status: 'shipped', title: 'Undo, clipboard, SVG, outline JSON',
                why: 'Round-trip is the pipeline.',
                test: 'Copy writes <svg>; paste pathCount +1; Export downloads .svg; Save downloads draw-outline-v2 JSON; loadOutline restores nodeCount.' }),

            card({ id: 'p1-rubber', phase: 'P1', status: 'shipped', title: 'Pen rubber-band preview',
                why: 'You should see the next segment before the click.',
                test: 'In pen mode with ≥1 point, mousemove (no down) draws a preview segment to the cursor; click commits; Esc cancels preview without adding a node.',
                notes: 'Shipped 2026-09-01. Dashed next-segment to cursor; close-hint on first anchor; click commits; Esc clears without adding a node. Preview is not in SVG export.' }),
            card({ id: 'p1-insert', phase: 'P1', status: 'shipped', title: 'Click segment to insert anchor',
                why: 'Direct-select editing needs mid-path points.',
                test: 'A-mode click on a stroke (not an anchor): nodeCount +1; new point lies on the segment; path stays closed if it was.',
                notes: 'Shipped 2026-09-01. A-mode stroke click inserts a point on the cubic (de Casteljau split); closed stays closed; anchor click does not insert. V-mode still selects the path.' }),
            card({ id: 'p1-convert', phase: 'P1', status: 'shipped', title: 'Convert corner ↔ smooth',
                why: 'Handles are the pen tool.',
                test: 'Double-click corner → hasHandles true with mirrored cp; Alt-drag one handle breaks the pair (cp1/cp2 independent); double-click smooth retracts handles.',
                notes: 'Shipped 2026-09-01. A/pen dblclick toggles corner↔smooth (mirrored handles). Alt-drag sets broken so later drags stay independent. Dblclick smooth retracts.' }),
            card({ id: 'p1-nudge', phase: 'P1', status: 'shipped', title: 'Arrow-key nudge',
                why: 'Pixel placement without the mouse.',
                test: 'Direct-select a point; ArrowRight moves x by 1; Shift+ArrowRight by 10; V-select path nudges every point.',
                notes: 'Shipped 2026-09-01. Arrow keys nudge 1px (Shift=10). A-mode moves the selected point; V-mode moves every point on the path. Locked paths ignore nudge.' }),

            card({ id: 'p2-marquee', phase: 'P2', status: 'shipped', title: 'Marquee-select points',
                why: 'Edit several anchors at once.',
                test: 'A-mode drag empty: rectangle; points inside become selected; drag moves all of them; nodeCount unchanged.',
                notes: 'Shipped 2026-09-01. A-mode empty drag draws a marquee; points inside are selected; drag a selected point moves the set; click empty still deselects. nodeCount unchanged.' }),
            card({ id: 'p2-bbox', phase: 'P2', status: 'shipped', title: 'Scale / rotate from bbox',

        const SEED = { version: 42, filter: 'all', cards: SEED_CARDS, inbox: [] };

        let state = clone(SEED);

        function clone(v) { return JSON.parse(JSON.stringify(v)); }

        function toast(msg, err) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show' + (err ? ' err' : '');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => el.classList.remove('show'), 2400);
        }

        function persist() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        }

        function load() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);
                if (!data || !Array.isArray(data.cards)) return;
                state.cards = data.cards;
                state.inbox = Array.isArray(data.inbox) ? data.inbox : [];
                state.filter = data.filter || 'all';
                state.version = data.version || 1;
            } catch (e) {}
        }

            const seedVer = SEED.version || 1;
            if ((state.version || 1) >= seedVer) return;

                    c.updated = NOW();

            ship('p4-paste', 'Shipped 2026-09-03. Paste in place keeps x/y; paste in front is top of hit-test.');
            ship('p5-rulers', 'Shipped 2026-09-06. Drag top/left rulers to create guides; drag to move; Delete or drag outside to remove. Undo/redo, JSON open/save and session restore verified in Chromium; visible at 5%–6400% zoom.');
            ship('p5-snap', 'Shipped 2026-09-06. Inspector snapping toggle (off by default, remembered). Six screen-pixel tolerance for visible grid, anchor points and guides. Pen/shape placement and anchor/path translation snap; moving anchors are excluded and path geometry is preserved. Visible grid spacing follows zoom; hiding the grid disables grid targets. Chromium verified on/off coordinates, guides/points, hidden target exclusion, zoom tolerance, undo/redo, pen/rectangle creation, rigid path movement and reload; rulers regression passed.');
            ship('p5-zoom-sel', 'Shipped 2026-09-06. View > Zoom to Selection / Ctrl+2 frames selected paths with 48px padding beyond the rulers. Includes Bezier control points and stroke width; supports multiple paths, lines and a single anchor. Empty selection leaves camera unchanged. Chromium verified menu/keyboard framing and finite camera state.');
            ship('p5-xy', 'Shipped 2026-09-06. Transform inspector Anchor X/Y fields edit one unlocked direct-selected anchor. Enter or blur commits; Escape cancels. Exact finite coordinates bypass snapping, translate both handles, preserve other anchors, and support undo/redo and session persistence. Chromium verified X=400, negative/decimal Y, invalid input and locked-anchor protection.');
            if (!state.cards.some(c => c.id === 'p6-entity-panel')) {
                state.cards.push(clone(SEED_CARDS.find(c => c.id === 'p6-entity-panel')));
            }
            ship('p6-entity-panel', 'Shipped 2026-09-06. Right-inspector Entity Harness prompt panel with configurable API/model, Connect, Generate/Cancel, isolated SVG preview and Copy/Paste/Insert. Default connects directly to Entity model server at http://127.0.0.1:8081/v1; the :8002 proxy has a confirmed Content-Length bug. Real fable-agentic-0.8b generation produced 4 editable paths with document unchanged; insertion/undo/redo, preview pixels, clipboard/manual paste, invalid output, errors, cancellation and reload passed Chromium checks. Includes one format-repair retry, remembered draft and connection, and in-memory-only optional API key. Flat-color geometry subset; details in planning/entity-panel.md. Fixed existing SVG Y-origin export error.');
            ship('p6-pencil', 'Shipped 2026-09-07. Pencil (N) with live preview, screen-space simplification and editable anchors. Release commits one path and one undo step; clicks, Escape, pointer cancellation and tool switching discard drafts. Chromium: 101 samples simplified to 11 anchors; undo/redo, straight lines and session reload passed.');
            ship('p6-bool', 'Shipped 2026-09-07. Path menu and inspector Unite/Subtract Front for selected unlocked closed shapes. Backmost appearance and stack position retained. Cubic-preserving Paper.js engine is vendored for offline use. Compound holes/islands stay one editable path through direct edits, segment insertion, transforms, SVG/JSON, clipboard, undo/redo and reload. Chromium verified exact rectangle areas, transparent holes, curved shapes, disjoint/touching/identical inputs, multiple cutters, empty subtraction and atomic failure. Tests: tests/pathfinder.py; precision, snapping, pencil and offline Entity regressions passed.');
            ship('p6-artboards', 'Shipped 2026-09-07. Artboards inspector: add/select/name/position/resize/remove, Fit active and Fit all. Shared world-coordinate artwork stays unchanged when boards change. SVG area selector exports exact active bounds with clipping or all artwork. Outline v4 saves boards and active ID, including empty documents; legacy single boards migrate. Undo/redo, SVG download pixels, blank save/open/reload, removal preserving paths and Entity insertion on the active board passed Chromium. Precision, snapping, Pencil, Pathfinder, rulers and offline Entity regressions passed. Details: planning/artboards.md.');
            ship('p6-png', 'Shipped 2026-09-07. File menu and Output panel PNG export uses selected Active artboard or All artwork area with 1x–4x scale and transparent background. Real image/png downloads verified at 1x, 2x and 4x for exact dimensions, gold pixels and transparency; blank export, area selection, encoding failure recovery and size limits passed. Artboards, Pathfinder, Pencil, precision, snapping, rulers and offline Entity regressions passed. Details: planning/png-svg-drop.md.');
            ship('p6-drop', 'Shipped 2026-09-07. Drop one or multiple SVG files onto the viewport to add editable paths at the drop position with one-step undo. Shared Paste/Open parser handles basic shapes, curves/arcs, transforms, compound contours and opaque linear gradients. Drag feedback, undo/redo, reload, multi-file atomicity, malformed/unsupported files, failed reads and document changes during reads verified. No external requests or browser errors. Details: planning/png-svg-drop.md.');
            const pencilCard = SEED_CARDS.find(c => c.id === 'ciugnj9v');
            const existingPencil = state.cards.find(c => c.id === pencilCard.id);
            if (!existingPencil) state.cards.push(clone(pencilCard));
            else if (existingPencil.status !== 'shipped') Object.assign(existingPencil, {status:pencilCard.status, notes:pencilCard.notes, test:pencilCard.test, updated:pencilCard.updated});
            for (const id of ['c6dq4mke', 'cx0msoze', 'cfexyn3o', 'cr84porb', 'c9vi4e0b']) {
                const seed = SEED_CARDS.find(c => c.id === id);
                const existing = state.cards.find(c => c.id === id);
                const inbox = state.inbox.find(c => c.id === id);
                if (!existing) state.cards.push({ ...clone(seed), ...(inbox || {}), status: seed.status, notes: seed.notes });
                else if (existing.status !== 'shipped') Object.assign(existing, { status: seed.status, notes: seed.notes, updated: seed.updated });
                state.inbox = state.inbox.filter(c => c.id !== id);
            }
            // Bring existing browser boards up to date without losing custom cards or notes.
            for (const id of ["c5aikqvn", "ceip7mb9", "cp52taxv", "cjkgoo1s", "c0tkdhbq", "p3-colour-swapper", "p3-stroke-grad", "cyb0pf3h", "cx9tgwvz", "ct8ebh0i", "cjriuz69", "c46iw5mp", "c8g9lqt2"]) {
                const seed = SEED_CARDS.find(c => c.id === id);
                const existing = state.cards.find(c => c.id === id);
                const inbox = state.inbox.find(c => c.id === id);
                if (!existing) {
                    const merged = { ...clone(seed), ...(inbox || {}), status: seed.status, test: seed.test, updated: seed.updated };
                    merged.notes = inbox?.notes ? inbox.notes + '\n\n' + seed.notes : seed.notes;
                    state.cards.push(merged);
                } else if (Date.parse(existing.updated || '') <= Date.parse(seed.updated) || !existing.updated) {
                    if (existing.status !== 'shipped') existing.status = seed.status;
                    existing.test = existing.test || seed.test;
                    if (!existing.notes) existing.notes = seed.notes;
                    else if (!existing.notes.includes(seed.notes)) existing.notes += '\n\n' + seed.notes;
                    existing.updated = seed.updated;
                }
                state.inbox = state.inbox.filter(c => c.id !== id);
            }
            state.version = seedVer;
            persist();
        }

        function activeIncrement() {
            return state.cards.find(c => c.status === 'building')
                || state.cards.find(c => c.status === 'next')
                || state.cards.find(c => c.status === 'testing')
                || null;
        }

        function counts() {
            const work = state.cards.filter(c => c.status !== 'inbox');
            const shipped = work.filter(c => c.status === 'shipped').length;
            return { work: work.length, shipped };
        }

        function exclusiveStatus(id, status) {
            if (status === 'next' || status === 'building') {
                for (const c of state.cards) {
                    if (c.id !== id && (c.status === 'next' || c.status === 'building')) {
                        c.status = 'queued';
                        c.updated = NOW();
                    }
                }
            }
        }

        function setStatus(id, status) {
            const c = state.cards.find(x => x.id === id);
            if (!c) return false;
            if (status === 'shipped' && !String(c.test || '').trim()) {
                toast('Write an acceptance test before shipping.', true);
                const ta = document.querySelector(`[data-card="${id}"] textarea.test`);
                if (ta) ta.focus();
                return false;
            }
            exclusiveStatus(id, status);
            c.status = status;
            c.updated = NOW();
            persist();
            render();
            return true;
        }

        function updateField(id, field, value) {
            const c = state.cards.find(x => x.id === id) || state.inbox.find(x => x.id === id);
            if (!c) return;
            c[field] = value;
            c.updated = NOW();
            persist();
        }

        function renderPhases() {
            const nav = document.getElementById('phaseNav');
            nav.innerHTML = '<div class="phase-label">Roadmap</div>';
            for (const p of PHASES) {
                const n = p.id === 'all'
                    ? state.cards.length
                    : state.cards.filter(c => c.phase === p.id).length;
                const shipped = p.id === 'all'
                    ? state.cards.filter(c => c.status === 'shipped').length
                    : state.cards.filter(c => c.phase === p.id && c.status === 'shipped').length;
                const btn = document.createElement('button');
                btn.className = 'phase-btn' + (state.filter === p.id ? ' active' : '');
                btn.innerHTML = `${p.name}<small>${p.blurb} · ${shipped}/${n}</small>`;
                btn.addEventListener('click', () => { state.filter = p.id; persist(); render(); });
                nav.appendChild(btn);
            }
        }

        function statusButtons(c) {
            const s = c.status;
            const btns = [];
            if (s === 'queued') btns.push(['Make next', 'next'], ['Park', 'parked']);
            if (s === 'next') btns.push(['Start building', 'building'], ['Park', 'parked']);
            if (s === 'building') btns.push(['To testing', 'testing'], ['Park', 'parked']);
            if (s === 'testing') btns.push(['Ship', 'shipped'], ['Back to building', 'building']);
            if (s === 'shipped') btns.push(['Reopen', 'queued']);
            if (s === 'parked') btns.push(['Restore', 'queued']);
            return btns;
        }

        function renderBoard() {
            const list = document.getElementById('cardList');
            const phase = PHASES.find(p => p.id === state.filter);
            const cards = state.cards
                .filter(c => state.filter === 'all' || c.phase === state.filter)
                .slice()
                .sort((a, b) => {
                    const order = { building: 0, next: 1, testing: 2, queued: 3, parked: 4, shipped: 5 };
                    return (order[a.status] ?? 9) - (order[b.status] ?? 9);
                });
            document.getElementById('boardTitle').textContent = phase ? phase.name : 'Board';
            document.getElementById('boardCount').textContent = cards.length + ' cards';
            document.getElementById('filterHint').textContent = (phase && phase.id !== 'all') ? phase.id : 'ALL PHASES';
            list.innerHTML = '';
            if (!cards.length) {
                list.innerHTML = '<div class="empty">No cards in this phase.</div>';
                return;
            }
            for (const c of cards) list.appendChild(renderCard(c));
        }

        function renderCard(c) {
            const el = document.createElement('article');
            el.className = 'card ' + c.status;
            el.dataset.card = c.id;
            el.innerHTML = `
                <div class="card-top">
                    <span class="pill">${c.phase}</span>
                    <span class="pill ${c.status}">${c.status}</span>
                    <input class="card-title" data-f="title" value="">
                </div>
                <div class="field"><label>Why</label><textarea class="grow" data-f="why"></textarea></div>
                <div class="field"><label>Acceptance test</label><textarea class="grow test" data-f="test"></textarea></div>
                <div class="field"><label>Notes</label><textarea class="grow" data-f="notes"></textarea></div>
                <div class="card-actions"></div>
            `;
            el.querySelector('.card-title').value = c.title;
            el.querySelector('[data-f="why"]').value = c.why || '';
            el.querySelector('[data-f="test"]').value = c.test || '';
            el.querySelector('[data-f="notes"]').value = c.notes || '';
            el.querySelectorAll('[data-f]').forEach(inp => {
                inp.addEventListener('input', () => updateField(c.id, inp.dataset.f, inp.value));
            });
            const actions = el.querySelector('.card-actions');
            for (const [label, st] of statusButtons(c)) {
                const b = document.createElement('button');
                b.textContent = label;
                if (st === 'shipped') b.className = 'gold';
                b.addEventListener('click', () => setStatus(c.id, st));
                actions.appendChild(b);
            }
            return el;
        }

        function renderInbox() {
            const box = document.getElementById('inboxList');
            box.innerHTML = '';
            if (!state.inbox.length) {
                box.innerHTML = '<div class="empty">Type a feature and press Queue.</div>';
                return;
            }
            state.inbox.forEach((item, idx) => {
                const el = document.createElement('div');
                el.className = 'inbox-item';
                el.innerHTML = `
                    <div class="t"></div>
                    <div class="meta"></div>
                    <div class="row"></div>
                `;
                el.querySelector('.t').textContent = item.title;
                el.querySelector('.meta').textContent = (item.phase || 'unassigned') + (item.test ? ' · has test' : '');
                const row = el.querySelector('.row');
                const mk = (label, fn, cls) => {
                    const b = document.createElement('button');
                    b.textContent = label;
                    if (cls) b.className = cls;
                    b.addEventListener('click', fn);
                    row.appendChild(b);
                };
                mk('↑', () => moveInbox(idx, -1));
                mk('↓', () => moveInbox(idx, 1));
                mk('Promote', () => promoteInbox(item.id), 'gold');
                mk('Park', () => { parkInbox(item.id); });
                mk('Delete', () => { state.inbox = state.inbox.filter(x => x.id !== item.id); persist(); render(); }, 'danger');
                box.appendChild(el);
            });
        }

        function moveInbox(idx, dir) {
            const j = idx + dir;
            if (j < 0 || j >= state.inbox.length) return;
            const [it] = state.inbox.splice(idx, 1);
            state.inbox.splice(j, 0, it);
            persist();
            render();
        }

        function promoteInbox(id) {
            const idx = state.inbox.findIndex(x => x.id === id);
            if (idx < 0) return;
            const [item] = state.inbox.splice(idx, 1);
            state.cards.push(card({
                id: item.id,
                title: item.title,
                phase: item.phase || 'P1',
                status: 'queued',
                why: item.why || 'Queued from inbox.',
                test: item.test || '',
                notes: item.notes || ''
            }));
            persist();
            render();
            toast('Promoted to ' + (item.phase || 'P1') + ' queue.');
        }

        function parkInbox(id) {
            const idx = state.inbox.findIndex(x => x.id === id);
            if (idx < 0) return;
            const [item] = state.inbox.splice(idx, 1);
            state.cards.push(card({
                id: item.id,
                title: item.title,
                phase: item.phase || 'P6',
                status: 'parked',
                why: item.why || '',
                test: item.test || ''
            }));
            persist();
            render();
        }

        function renderHeader() {
            const { work, shipped } = counts();
            document.getElementById('progressLabel').textContent = `${shipped} / ${work} shipped`;
            document.getElementById('progressFill').style.width = (work ? (shipped / work) * 100 : 0) + '%';
            const inc = activeIncrement();
            document.getElementById('currentInc').textContent = inc
                ? (inc.status.toUpperCase() + ': ' + inc.title)
                : 'NEXT: —';
        }

        function render() {
            renderHeader();
            renderPhases();
            renderBoard();
            renderInbox();
        }

        document.getElementById('queueForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('qTitle').value.trim();
            if (!title) { toast('Name the feature first.', true); return; }
            state.inbox.push({
                id: uid(),
                title,
                phase: document.getElementById('qPhase').value,
                test: document.getElementById('qTest').value.trim(),
                why: '',
                notes: '',
                created: NOW()
            });
            document.getElementById('qTitle').value = '';
            document.getElementById('qTest').value = '';
            persist();
            render();
            toast('Queued.');
        });

        document.getElementById('btnExport').addEventListener('click', () => {
            const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'eve-roadmap.json';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 400);
            toast('Exported eve-roadmap.json');
        });

        document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileImport').click());
        document.getElementById('fileImport').addEventListener('change', async () => {
            const file = fileImport.files && fileImport.files[0];
            fileImport.value = '';
            if (!file) return;
            try {
                const data = JSON.parse(await file.text());
                if (!data || !Array.isArray(data.cards)) throw new Error('bad');
                state.cards = data.cards;
                state.inbox = Array.isArray(data.inbox) ? data.inbox : [];
                state.filter = data.filter || 'all';
                persist();
                render();
                toast('Imported.');
            } catch (e) {
                toast('Could not read that JSON.', true);
            }
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            if (!confirm('Reset cards to the baked-in seed?')) return;
            let inbox = state.inbox.slice();
            if (inbox.length && confirm('Also clear the feature queue?')) inbox = [];
            state = clone(SEED);
            state.inbox = inbox;
            persist();
            render();
            toast(inbox.length ? 'Seed restored (inbox kept).' : 'Seed restored.');
        });

        window.__ROADMAP__ = {
            getState: () => clone(state),
            seed: () => clone(SEED),
            addInbox: (title, extra) => {
                state.inbox.push({ id: uid(), title, phase: '', test: '', ...extra, created: NOW() });
                persist(); render();
            },
            promote: promoteInbox,
            setStatus,
            setFilter: (f) => { state.filter = f; persist(); render(); },
            resetSeed: (keepInbox) => {
                const inbox = keepInbox ? state.inbox.slice() : [];
                state = clone(SEED);
                state.inbox = inbox;
                persist(); render();
            },
            loadFromObject: (data) => {
                state.cards = data.cards; state.inbox = data.inbox || []; state.filter = data.filter || 'all';
                persist(); render();
            }
        };

        load();
        migrate();
        render();
    </script>
</body>
</html>
